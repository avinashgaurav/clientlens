name: Deploy Landing Page

# Publishes /landing/ to the `gh-pages` branch, which GitHub Pages serves
# directly. The extension build is untouched: only /landing/ is published.
#
# Why not actions/deploy-pages: the Actions deployment queue killed 3 of 4
# deploys on this repo. The action aborts with "Timeout reached, aborting!" after
# 600s in deployment_queued / deployment_in_progress and then CANCELS the
# deployment it created, leaving the site on the previous build. Its documented
# `timeout` input does not help; run 31109092197 received `timeout: 1800000` and
# still aborted at exactly 600s. Branch-based Pages builds do not use that queue
# at all, so the failure mode is gone rather than waited out.
#
# One-time repo setup (Settings -> Pages):
#   Source: "Deploy from a branch", Branch: gh-pages, Folder: / (root)
#
# The gh-pages branch is generated. Never hand-edit it; edit landing/ on main.

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:

# Only contents:write is needed now. No pages: write, no id-token: write.
permissions:
  contents: write

# Serialise publishes so two runs cannot race the same branch. Never cancel an
# in-flight one; a half-written gh-pages is worse than a slow deploy.
concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need the remote gh-pages ref to parent onto, so no shallow clone.
          fetch-depth: 0

      - name: Publish landing/ to gh-pages
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Build the published tree with plumbing rather than by copying files
          # around and deleting things. A scratch index keeps the working tree
          # completely untouched.
          GIT_INDEX_FILE="$(mktemp -u)"
          export GIT_INDEX_FILE
          git read-tree "HEAD:landing"

          # .nojekyll makes Pages serve the files verbatim instead of running
          # them through Jekyll, which would drop any path beginning with _.
          blob="$(printf '' | git hash-object -w --stdin)"
          git update-index --add --cacheinfo "100644,${blob},.nojekyll"

          tree="$(git write-tree)"
          unset GIT_INDEX_FILE

          parent="$(git rev-parse --verify --quiet refs/remotes/origin/gh-pages || true)"

          if [ -n "$parent" ] && [ "$(git rev-parse "${parent}^{tree}")" = "$tree" ]; then
            echo "landing/ is byte-identical to what gh-pages already serves; nothing to publish."
            exit 0
          fi

          msg="chore(pages): publish landing/ from ${GITHUB_SHA:0:7}"
          if [ -n "$parent" ]; then
            commit="$(git commit-tree "$tree" -p "$parent" -m "$msg")"
          else
            commit="$(git commit-tree "$tree" -m "$msg")"
          fi

          # Fast-forward, so no force push and no history rewrite.
          git push origin "${commit}:refs/heads/gh-pages"
          echo "published $commit to gh-pages"

      - name: Where to look
        run: |
          echo "Pages serves the gh-pages branch."
          echo "Site: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "A branch build usually appears within a minute or two."
