<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Wingman</title>
  <link rel="icon" type="image/png" sizes="128x128" href="icons/icon128.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/icon16.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!--
    Multi-skin type stack:
      Inter Variable: primary sans (substitute for Geist, CursorGothic,
                        SpotifyMixUI, D-DIN-Bold across all six skins)
      JetBrains Mono: eyebrow / code / meta
      Space Grotesk: kept as V1 fallback so legacy components don't
                        shift if the variable font fails to load

    Google Fonts is loaded from fonts.googleapis.com / fonts.gstatic.com.
    Default MV3 CSP for extension_pages permits external stylesheets, so
    this works in standard Chrome installs. If Google Fonts is blocked
    (corporate proxy, strict CSP, offline use), the type stack degrades
    gracefully to system-ui / -apple-system / Segoe UI via the fallback
    chain in tailwind.config.js + index.css. The page remains usable;
    only the type cut shifts.
  -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
  />
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      border-radius: 0;
    }
    html, body {
      font-family: 'Inter', 'Space Grotesk', system-ui, -apple-system, sans-serif;
      font-feature-settings: 'cv11', 'ss03', 'ss01';
      letter-spacing: -0.02em;
      width: 100%;
      height: 100%;
    }
    body {
      width: 100%;
      min-width: 320px;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      /* Initial paint colors before tokens.css loads (PostHog defaults) */
      background: #EEEFE9;
      color: #23251D;
    }
    #root { width: 100%; height: 100vh; }
    code, .mono, pre {
      font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
    }
    .num { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/sidebar/main.tsx"></script>
</body>
</html>
